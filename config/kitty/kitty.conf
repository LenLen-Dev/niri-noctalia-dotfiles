include themes/noctalia.conf

# --- Font (user setting; the Noctalia kitty template only touches the include
# above and leaves these lines alone) ---
font_family FiraCode Nerd Font Mono
font_size 14

# --- Frosted glass ---
# niri blurs the background behind kitty (see the kitty window-rule in
# ~/.config/niri/config.kdl); this opacity is what lets the blur show through.
background_opacity 0.8
dynamic_background_opacity yes

# --- Window behaviour ---
# Hide kitty's own title bar (niri's tiling border is enough). Needs a full
# kitty restart to take effect (reload of this option is undefined).
hide_window_decorations yes
# Never ask to confirm when closing a window/tab or quitting kitty, even when a
# command (e.g. opencode) is still running.
confirm_os_window_close 0

# --- Shell ---
# Force zsh so kitty opens zsh even before the session's $SHELL has been
# refreshed by a fresh login. Harmless to keep afterwards.
shell /usr/bin/zsh
