<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  User fontconfig  (~/.config/fontconfig/fonts.conf)
    - code / monospace font : FantasqueSansM Nerd Font Mono
    - Chinese (CJK)         : LXGW Neo Xi Hei Plus  (霞鹜新晰黑＋)
-->
<fontconfig>

  <!-- 1) "monospace" -> Fantasque first, then LXGW for Chinese glyphs. -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>FantasqueSansM Nerd Font Mono</string>
      <string>LXGW Neo Xi Hei Plus</string>
    </edit>
  </match>

  <!-- 2) Apps that request the code font directly also get the CJK fallback. -->
  <match target="pattern">
    <test name="family"><string>FantasqueSansM Nerd Font Mono</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>LXGW Neo Xi Hei Plus</string>
    </edit>
  </match>

  <!-- 3) Chinese text prefers LXGW as a fallback (append + strong, so it
       supplies CJK glyphs without overriding explicitly requested fonts). -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>LXGW Neo Xi Hei Plus</string>
    </edit>
  </match>

</fontconfig>
